config:
  backup: true
  banner: true
  create: true
  dotpath: dotfiles
  keepdot: false
  link_dotfile_default: nolink
  link_on_import: nolink
  longkey: false
variables:
  keyid: "{{@@ env['GPG_KEY_ID'] @@}}"
actions:
  vim_plug_install: curl -fLo ~/.vim/autoload/plug.vim --create-dirs 
    https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
  tmux_tpm_install: mkdir -p ~/.tmux/plugins && git clone 
    https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
trans_install:
  _decrypt: gpg -q --for-your-eyes-only --no-tty -d {0} > {1}
trans_update:
  _encrypt: gpg -q -r {{@@ keyid @@}} --armor --no-tty -o {1} -e {0}
dotfiles:
  f_vimrc:
    src: vimrc
    dst: ~/.vimrc
    actions:
    - vim_plug_install
  f_zshrc:
    src: zshrc
    dst: ~/.zshrc
  f_ansible.cfg:
    src: ansible.cfg
    dst: ~/.ansible.cfg
  f_asdfrc:
    src: asdfrc
    dst: ~/.asdfrc
  f_editorconfig:
    src: editorconfig
    dst: ~/.editorconfig
  f_gemrc:
    src: gemrc
    dst: ~/.gemrc
  f_gitignore_global:
    src: gitignore_global
    dst: ~/.gitignore_global
  f_overcommit.yml:
    src: overcommit.yml
    dst: ~/.overcommit.yml
  f_taskrc:
    src: taskrc
    dst: ~/.taskrc
  f_tmux.conf:
    src: tmux.conf
    dst: ~/.tmux.conf
    actions:
    - tmux_tpm_install
  f_zprofile:
    src: zprofile
    dst: ~/.zprofile
  f_id_github.pub:
    src: ssh/id_github.pub
    dst: ~/.ssh/id_github.pub
  f_id_rsa.pub:
    src: ssh/id_rsa.pub
    dst: ~/.ssh/id_rsa.pub
  f_ssh_config:
    src: ssh/config
    dst: ~/.ssh/config
    chmod: '600'
  d_alias:
    src: config/alias
    dst: ~/.config/alias
  d_direnv:
    src: config/direnv
    dst: ~/.config/direnv
  f_karabiner.json:
    src: config/karabiner/karabiner.json
    dst: ~/.config/karabiner/karabiner.json
    chmod: '600'
  f_1683048690.json:
    src: config/karabiner/assets/complex_modifications/1683048690.json
    dst: ~/.config/karabiner/assets/complex_modifications/1683048690.json
  f_1683049260.json:
    src: config/karabiner/assets/complex_modifications/1683049260.json
    dst: ~/.config/karabiner/assets/complex_modifications/1683049260.json
  d_nvim:
    src: config/nvim
    dst: ~/.config/nvim
  f_zshenv:
    src: zshenv
    dst: ~/.zshenv
  f_gitconfig:
    src: gitconfig
    dst: ~/.gitconfig
  f_allowed_signers:
    src: ssh/allowed_signers
    dst: ~/.ssh/allowed_signers
  f_tool-versions:
    src: tool-versions
    dst: ~/.tool-versions
  f_wezterm.lua:
    src: wezterm.lua
    dst: ~/.wezterm.lua
  f_ghostty_config:
    src: config/ghostty/config
    dst: ~/.config/ghostty/config
  d_zsh:
    src: config/zsh
    dst: ~/.config/zsh
profiles:
  PUB-MAC-BRASA:
    dotfiles:
    - f_vimrc
    - f_zshrc
    - f_ansible.cfg
    - f_asdfrc
    - f_editorconfig
    - f_gemrc
    - f_gitignore_global
    - f_overcommit.yml
    - f_taskrc
    - f_tmux.conf
    - f_zprofile
    - f_id_github.pub
    - f_id_rsa.pub
    - f_ssh_config
    - d_alias
    - d_direnv
    - f_karabiner.json
    - f_1683048690.json
    - f_1683049260.json
    - d_nvim
    - f_zshenv
    - f_gitconfig
    - f_allowed_signers
    - f_tool-versions
    - f_wezterm.lua
    - f_ghostty_config
    - d_zsh
